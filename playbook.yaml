- name: Secure SSH and create vps-user
  hosts: webservers
  become: yes
  vars:
    vps_user: vps-user
    ssh_key: "{{ lookup('file', '~/.ssh/id_ed25519_vps.pub') }}"
  
  tasks:
    # --- Task Group 1: User Creation and SSH Key setup (runs as root) ---
    - name: Ensure 'sudo' group exists
      ansible.builtin.group:
        name: sudo
        state: present
      tags: user_setup
    
    - name: Create vps-user and add to sudo group
      ansible.builtin.user:
        name: "{{ vps_user }}"
        shell: /bin/bash
        create_home: yes
        state: present
        groups: sudo
        append: yes
      tags: user_setup

    - name: Allow passwordless sudo for vps-user
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ vps_user }}"
        line: "{{ vps_user }} ALL=(ALL) NOPASSWD:ALL"
        create: yes
        validate: "visudo -cf %s"
      tags: user_setup
    
    - name: Add SSH key for vps-user
      ansible.builtin.authorized_key:
        user: "{{ vps_user }}"
        state: present
        key: "{{ ssh_key }}"
      tags: user_setup
    

    # --- Task Group 2: SSH Hardening (runs as root) ---
    - name: Enforce SSH hardening before included configuration
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED SSH HARDENING"
        block: |
          PermitRootLogin no
          PasswordAuthentication no
      notify: Restart SSH
      tags: ssh_hardening

    # --- Task Group 3: Fail2Ban Installation and Configuration ---
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: yes
      tags: fail2ban

    - name: Install fail2ban
      ansible.builtin.package:
        name: fail2ban
        state: present
      tags: fail2ban

    - name: Ensure fail2ban service is started and enabled
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: yes
      tags: fail2ban

    - name: Ensure jail.d directory exists
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: fail2ban

    - name: Add custom jail configurations
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/{{ item.name }}.conf
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: '0644'
      with_items:
        - name: sshd
          content: |
            [sshd]
            enabled   = true
            mode      = aggressive
            maxretry  = 3
            findtime  = 1d
            bantime   = -1
            banaction = %(banaction_allports)s
            logpath   = %(sshd_log)s
            backend   = %(sshd_backend)s
            protocol  = tcp,udp,icmp,icmpv6,sctp,dccp,gre,esp,ah
      notify: Restart Fail2Ban
      tags: fail2ban

    - name: Apply SSH configuration changes
      ansible.builtin.meta: flush_handlers
      tags: ssh_hardening

    - name: Check effective SSH configuration
      ansible.builtin.command: sshd -T
      register: effective_ssh_config
      changed_when: false
      tags: ssh_hardening

    - name: Verify SSH hardening settings
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in effective_ssh_config.stdout_lines"
          - "'passwordauthentication no' in effective_ssh_config.stdout_lines"
      tags: ssh_hardening

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
    - name: Restart Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
